<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarSpotter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

<h1>🚗 CarSpotter</h1>

<button class="menu active">
🏠 Dashboard
</button>

<button class="menu">
📸 Spot Car
</button>

<button class="menu">
📚 Collection
</button>

<button class="menu">
🏆 Leaderboard
</button>

<button class="menu">
👤 Profile
</button>

</div>

<div class="main">

<header>

<div>

<h2>Welcome Back</h2>
<p>Build Your Dream Collection</p>

</div>

<div class="profile">

<img src="https://i.pravatar.cc/80">

<div>

<h4>Moriski</h4>

<span>Level 1</span>

</div>

</div>

</header>

<section class="stats">

<div class="card">

<h3>Total Cars</h3>

<h1 id="totalCars">0</h1>

</div>

<div class="card mythic">

<h3>Mythic</h3>

<h1 id="mythic">0</h1>

</div>

<div class="card legend">

<h3>Legend</h3>

<h1 id="legend">0</h1>

</div>

<div class="card epic">

<h3>Epic</h3>

<h1 id="epic">0</h1>

</div>

<div class="card elite">

<h3>Elite</h3>

<h1 id="elite">0</h1>

</div>

</section>

<section class="upload">

<h2>📸 Spot A Car</h2>

<input type="file" id="imageInput" accept="image/*">

<button id="scanBtn">

Scan With AI

</button>

</section>

<section class="result">

<h2>AI Detection</h2>

<div class="resultBox">

<p>Brand :</p>
<span id="brand">-</span>

<p>Model :</p>
<span id="model">-</span>

<p>Year :</p>
<span id="year">-</span>

<p>Score :</p>
<span id="score">-</span>

<p>Tier :</p>
<span id="tier">-</span>

</div>

</section>

<section class="filter">

<button class="filterBtn active">
All
</button>

<button class="filterBtn mythicBtn">
Mythic
</button>

<button class="filterBtn legendBtn">
Legend
</button>

<button class="filterBtn epicBtn">
Epic
</button>

<button class="filterBtn eliteBtn">
Elite
</button>

</section>

<section>

<h2>Your Collection</h2>

<div class="collection" id="collection">

<!-- Card Mobil akan muncul di sini -->

</div>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
